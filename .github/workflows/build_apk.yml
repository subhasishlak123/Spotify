name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Clean Android Project
        run: |
          mkdir -p app/src/main/java/com/example/spotifyclone

          # 1. Properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 2. Build configuration
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.spotifyclone"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.spotifyclone"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              val media3Version = "1.3.1"
              implementation("androidx.media3:media3-exoplayer:$media3Version")
              implementation("androidx.media3:media3-session:$media3Version")
              implementation("androidx.media3:media3-ui:$media3Version")
          }
          EOF

          # 3. Crash-Proof MainActivity with on-screen error reporter
          cat << 'EOF' > app/src/main/java/com/example/spotifyclone/MainActivity.kt
          package com.example.spotifyclone

          import android.app.Activity
          import android.content.ComponentName
          import android.os.Bundle
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import androidx.core.content.ContextCompat
          import androidx.media3.common.MediaItem
          import androidx.media3.session.MediaController
          import androidx.media3.session.SessionToken

          class MainActivity : Activity() {
              private var controller: MediaController? = null
              private lateinit var statusText: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val scroll = ScrollView(this)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(50, 100, 50, 50)
                  }

                  statusText = TextView(this).apply {
                      text = "Status: Ready\nTap Play to start background music."
                      textSize = 16f
                      setPadding(0, 0, 0, 30)
                  }

                  val playBtn = Button(this).apply {
                      text = "▶ Play Music (Background)"
                      setOnClickListener {
                          startMusic()
                      }
                  }

                  val pauseBtn = Button(this).apply {
                      text = "⏸ Pause (Stops Background Service)"
                      setOnClickListener {
                          try {
                              controller?.pause()
                              statusText.text = "Status: Paused"
                          } catch (e: Exception) {
                              statusText.text = "Error pausing: ${e.message}"
                          }
                      }
                  }

                  layout.addView(statusText)
                  layout.addView(playBtn)
                  layout.addView(pauseBtn)
                  scroll.addView(layout)
                  setContentView(scroll)
              }

              private fun startMusic() {
                  try {
                      statusText.text = "Connecting to background service..."
                      val token = SessionToken(this, ComponentName(this, PlaybackService::class.java))
                      val controllerFuture = MediaController.Builder(this, token).buildAsync()
                      controllerFuture.addListener({
                          try {
                              controller = controllerFuture.get()
                              controller?.let { player ->
                                  val item = MediaItem.fromUri("https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3")
                                  player.setMediaItem(item)
                                  player.prepare()
                                  player.play()
                                  statusText.text = "Status: Playing!\nYou can now close the app, music will stay in background."
                              }
                          } catch (e: Exception) {
                              statusText.text = "Playback Error:\n${e.message}\n${e.stackTraceToString()}"
                          }
                      }, ContextCompat.getMainExecutor(this))
                  } catch (e: Exception) {
                      statusText.text = "Service Error:\n${e.message}\n${e.stackTraceToString()}"
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  controller?.release()
              }
          }
          EOF

          # 4. Background Playback Service
          cat << 'EOF' > app/src/main/java/com/example/spotifyclone/PlaybackService.kt
          package com.example.spotifyclone

          import android.app.Service
          import androidx.media3.common.Player
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.session.MediaSession
          import androidx.media3.session.MediaSessionService

          class PlaybackService : MediaSessionService() {
              private var mediaSession: MediaSession? = null

              override fun onCreate() {
                  super.onCreate()
                  val player = ExoPlayer.Builder(this).build()

                  player.addListener(object : Player.Listener {
                      override fun onPlayWhenReadyChanged(playWhenReady: Boolean, reason: Int) {
                          if (!playWhenReady) {
                              stopForeground(Service.STOP_FOREGROUND_DETACH)
                          }
                      }

                      override fun onPlaybackStateChanged(playbackState: Int) {
                          if (playbackState == Player.STATE_ENDED) {
                              stopSelf()
                          }
                      }
                  })

                  mediaSession = MediaSession.Builder(this, player).build()
              }

              override fun onGetSession(controllerInfo: MediaSession.ControllerInfo): MediaSession? {
                  return mediaSession
              }

              override fun onDestroy() {
                  mediaSession?.run {
                      player.release()
                      release()
                      mediaSession = null
                  }
                  super.onDestroy()
              }
          }
          EOF

          # 5. AndroidManifest.xml (Uses standard Android icon so notifications never crash)
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:label="Spotify"
                  android:icon="@android:drawable/ic_media_play"
                  android:usesCleartextTraffic="true"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".PlaybackService"
                      android:foregroundServiceType="mediaPlayback"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="androidx.media3.session.MediaSessionService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spotify-app-debug-apk
          path: '**/*.apk'
          retention-days: 14
